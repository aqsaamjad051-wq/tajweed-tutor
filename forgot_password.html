<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password - Tajweed Tutor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0fff4;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007B5E;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none; }

    #otpInputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 10px 0;
    }
    .otpBox {
      width: 40px;
      height: 45px;
      font-size: 22px;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
    }
    .otpBox:focus {
      border-color: #007B5E;
      outline: none;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007B5E;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .eye-wrap {
      position: relative;
    }
    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Forgot Password</h2>

    <input type="email" id="email" placeholder="Enter your registered email" required />
    <button onclick="sendOTP()">📤 Send OTP</button>
    <button id="resendBtn" class="hidden" onclick="sendOTP()">🔁 Resend OTP</button>

    <div id="otpInputs" class="hidden">
      <input type="text" maxlength="1" class="otpBox" />
      <input type="text" maxlength="1" class="otpBox" />
      <input type="text" maxlength="1" class="otpBox" />
      <input type="text" maxlength="1" class="otpBox" />
      <input type="text" maxlength="1" class="otpBox" />
      <input type="text" maxlength="1" class="otpBox" />
    </div>

    <div class="eye-wrap">
      <input type="password" id="newPass" placeholder="New Password" />
      <span class="toggle-eye" onclick="toggleVisibility('newPass', this)">👁️</span>
    </div>

    <div class="eye-wrap">
      <input type="password" id="confirmPass" placeholder="Confirm Password" />
      <span class="toggle-eye" onclick="toggleVisibility('confirmPass', this)">👁️</span>
    </div>

    <button onclick="resetPassword()">🔄 Reset Password</button>

    <div id="loading" class="hidden" style="text-align:center; margin:10px 0;">
      <div class="spinner"></div>
      <p style="color: #007B5E; font-weight: bold;">Sending OTP...</p>
    </div>

    <p id="message" style="color:green; font-weight:bold;"></p>
  </div>

  <script>
    const API_SEND = "http://localhost/tajweed-tutor/send_otp.php";
    const API_RESET = "http://localhost/tajweed-tutor/reset_password.php";
    const otpInputs = document.querySelectorAll(".otpBox");

    otpInputs.forEach((input, i) => {
      input.addEventListener("input", () => {
        if (input.value.length === 1 && i < otpInputs.length - 1) {
          otpInputs[i + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && i > 0) {
          otpInputs[i - 1].focus();
        }
        if (e.key === "Enter" && i < otpInputs.length - 1) {
          otpInputs[i + 1].focus();
        }
      });
      input.addEventListener("paste", (e) => {
        e.preventDefault();
        const data = e.clipboardData.getData("text").slice(0, 6).split('');
        data.forEach((char, idx) => {
          if (otpInputs[idx]) {
            otpInputs[idx].value = char;
          }
        });
        if (otpInputs[data.length - 1]) {
          otpInputs[data.length - 1].focus();
        }
      });
    });

    document.getElementById("newPass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("confirmPass").focus();
      }
    });

    document.getElementById("confirmPass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        resetPassword();
      }
    });

    function getOTP() {
      return Array.from(otpInputs).map(i => i.value).join('');
    }

    function toggleVisibility(id, el) {
      const input = document.getElementById(id);
      const isPass = input.type === "password";
      input.type = isPass ? "text" : "password";
      el.textContent = isPass ? "🙈" : "👁️";
    }

    function sendOTP() {
      const email = document.getElementById("email").value.trim();
      const loading = document.getElementById("loading");
      const message = document.getElementById("message");

      if (!email) {
        alert("📧 Please enter your email address.");
        return;
      }

      loading.classList.remove("hidden");
      message.innerText = "";

      fetch(API_SEND, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      })
      .then(res => res.json())
      .then(data => {
        message.innerText = data.message;
        document.getElementById("resendBtn").classList.remove("hidden");
        document.getElementById("otpInputs").classList.remove("hidden");
        otpInputs[0].focus();
      })
      .catch(() => {
        message.innerText = "❌ Failed to send OTP.";
      })
      .finally(() => {
        loading.classList.add("hidden");
      });
    }

    function resetPassword() {
      const email   = document.getElementById("email").value.trim();
      const otp     = getOTP().trim();
      const newPass = document.getElementById("newPass").value;
      const confirm = document.getElementById("confirmPass").value;
      const message = document.getElementById("message");

      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/;

      if (!email || !otp || !newPass || !confirm) {
        alert("⚠️ Please fill in all fields");
        return;
      }

      if (!email.match(emailPattern)) {
        alert("📧 Please enter a valid email address");
        return;
      }

      if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
        alert("🔐 OTP must be 6 digits");
        return;
      }

      if (newPass.length < 6) {
        alert("🔑 Password must be at least 6 characters");
        return;
      }

      if (newPass !== confirm) {
        alert("⚠️ Passwords do not match");
        return;
      }

      fetch(API_RESET, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, otp, newPass })
      })
      .then(res => res.json())
      .then(data => {
        message.innerText = data.message;
if (data.message.includes("successful")) {
  message.style.color = "green";
  message.innerText = data.message + " Redirecting to login...";
  setTimeout(() => window.location.href = "login.html", 3000);
} else {
  message.style.color = "red";
}
      })
      .catch(() => {
        message.innerText = "❌ Failed to reset password.";
        message.style.color = "red";
      });
    }
  </script>
  </body>
</html>
