<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Tajweed Tutor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0fff4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #007B5E;
      color: white;
      padding: 15px;
      text-align: center;
    }

    section {
      padding: 20px;
      text-align: center;
    }

    form {
      margin-top: 20px;
    }

    input, button {
      display: block;
      width: 80%;
      max-width: 300px;
      padding: 10px;
      margin: 10px auto;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background-color: #007B5E;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: -8px;
      margin-bottom: 10px;
      max-width: 300px;
      text-align: left;
      margin-left: auto;
      margin-right: auto;
    }

    .welcome {
      color: #007B5E;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }

    a:hover {
      color: #007B5E;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 Tajweed Tutor Chatbot 🌿</h1>
  </header>

  <section>
    <h2>Sign In</h2>

    <!-- Optional: Show welcome back if redirected from success -->
    <p id="welcomeMsg" class="welcome"></p>

    <form method="POST" action="login.php" onsubmit="return validateLogin()">
      <input type="text" name="username" id="username" placeholder="Username" />
      <p id="usernameError" class="error"></p>

      <input type="password" name="password" id="password" placeholder="Password" />
      <p id="passwordError" class="error"></p>

      <button type="submit">Login</button>
    </form>

    <p>Forgot password? <a href="forgot_password.html">Click here</a></p>
    <p>If you don’t have an account, <a href="register.html">Sign Up Here</a></p>
  </section>

  <script>
    function validateLogin() {
      let isValid = true;
      document.getElementById("usernameError").textContent = "";
      document.getElementById("passwordError").textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (username === "") {
        document.getElementById("usernameError").textContent = "Please enter your username.";
        isValid = false;
      }

      if (password === "") {
        document.getElementById("passwordError").textContent = "Please enter your password.";
        isValid = false;
      }

      return isValid;
    }

    // Optional: Show welcome if redirected with ?msg=welcome
    window.onload = function () {
      const url = new URL(window.location.href);
      const msg = url.searchParams.get("msg");
      if (msg === "welcome") {
        document.getElementById("welcomeMsg").textContent = "👋 Welcome back!";
      }
    };
  </script>
</body>
</html>
